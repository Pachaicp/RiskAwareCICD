
name: Risk-Aware CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests and risk checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pytest httpx

      - name: Run automated tests   
        run: python -m pytest -v

      - name: Check API imports
        run: python -c "from main import app; print('API import successful')"

      - name: Check risk engine
        run: python risk_engine.py
