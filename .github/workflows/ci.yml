name: Risk-Aware CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests and risk checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pytest httpx pandas sqlalchemy

      - name: Run automated tests
        run: python -m pytest -v

      - name: Check API imports
        run: python -c "from main import app; print('API import successful')"

      - name: Check risk engine
        run: python risk_engine.py
  risk-gate:
    name: Evaluate release risk
    needs: test
    runs-on: ubuntu-latest
    outputs:
      risk_level: ${{ steps.evaluate.outputs.risk_level }}
      decision: ${{ steps.evaluate.outputs.decision }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Evaluate sample release risk
        id: evaluate
        run: |
          python - <<'PYTHON' >> "$GITHUB_OUTPUT"
          from risk_engine import Release, analyze_release

          release = Release(50, True, False, False, True)
          result = analyze_release(release)

          print(f"risk_level={result['risk_level']}")
          print(f"decision={result['decision']}")
          PYTHON

      - name: Show release decision
        run: |
          echo "Risk level: ${{ steps.evaluate.outputs.risk_level }}"
          echo "Decision: ${{ steps.evaluate.outputs.decision }}"
