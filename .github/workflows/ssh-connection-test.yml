
name: EC2 SSH Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Test SSH connection to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "Checking EC2 hostname..."
          echo "Host: $EC2_HOST"
          echo "User: $EC2_USER"

          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -vv -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" \
            'echo "SSH connection successful"; hostname'

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
